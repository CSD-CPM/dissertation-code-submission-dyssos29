name: Publish Continuous Images

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-images-main
  cancel-in-progress: false


jobs:
  # ==========================================================
  # Java images
  # ==========================================================
  publish-java-images:
    name: Publish Jib / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: restaurant-menu-service
            directory: services/restaurant-menu-service
            repository: restaurant-menu-service
          - name: order-service
            directory: services/order-service
            repository: order-service

    steps:
      - name: Check out merge commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            ${{ matrix.directory }}/pom.xml
      - name: Make Maven Wrapper executable
        working-directory: ${{ matrix.directory }}
        run: chmod +x mvnw
      - name: Authenticate with Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish SHA image with Jib
        working-directory: ${{ matrix.directory }}
        env:
          IMAGE_REPOSITORY: >
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.repository }}
        shell: bash
        run: |
          IMAGE="${IMAGE_REPOSITORY}:sha-${GITHUB_SHA}"

          ./mvnw \
            -B \
            -ntp \
            -DskipTests \
            package \
            jib:build \
            "-Djib.to.image=${IMAGE}"
      - name: Record immutable Java image
        working-directory: ${{ matrix.directory }}
        env:
          IMAGE_REPOSITORY: >
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.repository }}
        shell: bash
        run: |
          DIGEST="$(cat target/jib-image.digest)"

          {
            echo "### ${{ matrix.name }}"
            echo
            echo "Git revision:"
            echo
            echo "\`${GITHUB_SHA}\`"
            echo
            echo "Continuous-build tag:"
            echo
            echo '```text'
            echo "${IMAGE_REPOSITORY}:sha-${GITHUB_SHA}"
            echo '```'
            echo
            echo "Immutable image:"
            echo
            echo '```text'
            echo "${IMAGE_REPOSITORY}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  # ==========================================================
  # Go images
  # ==========================================================
  publish-go-images:
    name: Publish ko / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: delivery-tracking-service
            repository: delivery-tracking-service
            main-package: >
              ./services/delivery-tracking-service/cmd/delivery-tracking-service
          - name: payment-service
            repository: payment-service
            main-package: >
              ./services/payment-service/cmd/payment-service

    steps:
      - name: Check out merge commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
      - name: Set up ko
        uses: ko-build/setup-ko@v0.10
        with:
          version: v0.19.1
        env:
          KO_DOCKER_REPO: >
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.repository }}
      - name: Authenticate ko with Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          echo "${DOCKERHUB_TOKEN}" |
            ko login docker.io \
              --username "${DOCKERHUB_USERNAME}" \
              --password-stdin
      - name: Build and publish SHA image with ko
        env:
          KO_DOCKER_REPO: >
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.repository }}
        shell: bash
        run: |
          IMAGE_REFS="${RUNNER_TEMP}/${{ matrix.name }}-image-ref.txt"

          ko build \
            --bare \
            --tags="sha-${GITHUB_SHA}" \
            --image-label="org.opencontainers.image.revision=${GITHUB_SHA}" \
            --image-label="org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --image-refs="${IMAGE_REFS}" \
            "${{ matrix.main-package }}"

          IMAGE_REF="$(tail -n 1 "${IMAGE_REFS}")"

          {
            echo "### ${{ matrix.name }}"
            echo
            echo "Git revision:"
            echo
            echo "\`${GITHUB_SHA}\`"
            echo
            echo "Published image:"
            echo
            echo '```text'
            echo "${IMAGE_REF}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

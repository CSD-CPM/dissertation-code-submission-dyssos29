spring:
  application:
    name: order-service
  grpc:
    server:
      port: 9090

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true

    readinessstate:
      enabled: true

info:
  app:
    name: ${spring.application.name}

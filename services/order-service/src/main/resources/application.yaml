spring:
  application:
    name: order-service
  grpc:
    server:
      port: 9090
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5432/order_service_db}
    username: ${ORDER_DB_USER:order_service_user}
    password: ${ORDER_DB_PASSWORD:local-order-password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

restaurant-service:
  grpc:
    host: ${RESTAURANT_SERVICE_GRPC_HOST:restaurant-menu-service}
    port: ${RESTAURANT_SERVICE_GRPC_PORT:9090}
    quote-token: ${INTERNAL_QUOTE_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

info:
  app:
    name: ${spring.application.name}

logging:
  pattern:
    correlation: "[requestId=%X{requestId:-}] "

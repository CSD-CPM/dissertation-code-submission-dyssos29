spring:
  application:
    name: restaurant-menu-service
  grpc:
    server:
      port: 9090

  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/restaurant_menu_db}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true

  health:
    livenessstate:
      enabled: true

    readinessstate:
      enabled: true

info:
  app:
    name: ${spring.application.name}

logging:
  pattern:
    correlation: "[requestId=%X{requestId:-}] "
